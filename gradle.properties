# Gradle itself. This repository had no `gradle.properties` at all before the sborka migration, so
# every build here ran with the defaults: one worker, no build cache.
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.code.style=official

# WHAT THE CONVENTIONS READ. Each of these used to be a line of Kotlin in the root build file or in
# `publishing.gradle.kts`; the reasons that were written beside them are kept here.

# A default that is a snapshot on purpose: a build with no `-PVERSION` must not be able to produce
# something that looks like a release. 0.3.0 and not 0.2.1 because M-130 changed the default
# partitioner, so the same key goes to a different partition than it did in 0.2.0 — nothing in the
# ABI moved, which is exactly why the version has to say it.
version=0.3.0-SNAPSHOT

# `io.github.<login>` — coordinates whose ownership is proved by owning the GitHub account. A domain
# of one's own would need separate proof that the domain is ours.
sborka.group=io.github.youndie.booblik
sborka.repository=youndie/booblik
sborka.description=A message broker on an append-only log: segments, reads by a numeric offset, one process and no cluster.
sborka.inceptionYear=2026

# 25, not 21. Two things on the critical path are only available above 21: `FileChannel.map(mode,
# offset, size, Arena)` — a mapping without the 2 GB ceiling and with a deterministic release, unlike
# `MappedByteBuffer` (research §1.5); and virtual threads that no longer pin the carrier on
# `synchronized` (JEP 491, 24), which is what makes a thread-per-connection acceptor a fair baseline.
sborka.jvmToolchain=25
# The floor a consumer has to be on, and here it is the same number rather than a lower one: the
# client speaks to a broker built on those two APIs, and the published metadata has to say so — a
# consumer on 21 resolving this library would fail at class loading instead.
sborka.jvmFloor=25

# OFF, AND IT SHOULD NOT STAY OFF. `explicitApi()` is right for the four modules published here, and
# sborka turns it on by default; compilation stops in `:booblik-protocol` with 201 findings, before
# reaching the other eight modules. Spelling out a visibility and a return type on every public
# declaration is a change to the LIBRARY, not to how it is built — folded into the migration it would
# bury whatever the migration itself breaks in a diff nobody can read. The `api/` dumps keep the
# surface honest in the meantime, which is why this is a debt rather than a hole.
# Tracked separately: youndie/booblik#8.
sborka.explicitApi=false
