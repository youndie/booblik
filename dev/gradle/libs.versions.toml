[versions]
kotlin = "2.4.10"
ktor = "3.5.2"
logback = "1.6.1"
kafka = "4.3.1"
# The published client, from reposilite snapshots. Two earlier versions are skipped on purpose:
# 0.1.1 declared coroutines as `implementation`, so it resolves and then will not compile, and
# 0.1.2 carried the accumulator that drops a record when its flush timer fires as one arrives —
# which is what this sample found.
booblik = "0.1.3"

[libraries]
booblik-client = { module = "io.github.youndie.booblik:booblik-client", version.ref = "booblik" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio-jvm", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation-jvm", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json-jvm", version.ref = "ktor" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
kafka-clients = { module = "org.apache.kafka:kafka-clients", version.ref = "kafka" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
