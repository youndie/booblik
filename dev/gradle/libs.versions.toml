[versions]
kotlin = "2.4.10"
ktor = "3.5.2"
logback = "1.6.1"
# The published client, from reposilite snapshots. 0.1.1 is skipped on purpose: coroutines were
# declared `implementation` there, so it resolves and then fails to compile.
booblik = "0.1.2"

[libraries]
booblik-client = { module = "io.github.youndie.booblik:booblik-client", version.ref = "booblik" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio-jvm", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation-jvm", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json-jvm", version.ref = "ktor" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
