# The sample: one publisher, three consumers, one broker.
#
# The broker comes from GHCR rather than from this checkout — the sample runs against what was
# published, which is the only way it can notice a packaging mistake.
#
# Build the service distributions before `docker compose up`, or use ./run.sh which does both:
#   ./gradlew installDist

services:
  broker:
    image: ${BOOBLIK_IMAGE:-ghcr.io/youndie/booblik:0.1.0}
    # Published for amd64 only. Named explicitly so an arm64 host emulates it with a warning
    # instead of failing with "no matching manifest", which reads like a broken tag. Emulation is
    # fine for watching the sample and wrong for measuring it — set BOOBLIK_IMAGE and
    # BOOBLIK_PLATFORM to a native build before taking any number seriously.
    platform: ${BOOBLIK_PLATFORM:-linux/amd64}
    environment:
      # `tasks` and `claims` are one partition each, and that is the design rather than
      # thrift: the queue's arbiter is the order of a partition, and an order exists only
      # inside one.
      BOOBLIK_TOPICS: events:3,tasks:1,claims:1,mirrored:3,roundtrip:1
      BOOBLIK_METRICS_INTERVAL_MILLIS: 10000
    volumes:
      - broker-data:/var/lib/booblik
    ports:
      - "9092:9092"

  publisher:
    build: ./publisher
    environment:
      BOOBLIK_HOST: broker
      BOOBLIK_TOPIC: events
      PUBLISH_INTERVAL_MILLIS: 500
      BOOBLIK_TASKS_TOPIC: tasks
      TASK_INTERVAL_MILLIS: ${TASK_INTERVAL_MILLIS:-700}
    ports:
      - "8080:8080"
    depends_on:
      # The broker image carries a HEALTHCHECK that asks METADATA, so this waits for a broker that
      # answers rather than for a port that accepts. The kernel accepts a connection into the
      # backlog with no help from the process — a TCP check would pass on a hung broker.
      broker:
        condition: service_healthy

  consumer-0:
    build: ./consumer
    environment:
      CONSUMER_NAME: consumer-0
      BOOBLIK_HOST: broker
      BOOBLIK_TOPIC: events
      BOOBLIK_PARTITION: 0
    volumes:
      - consumer-0-state:/var/lib/consumer
    ports:
      - "8081:8080"
    depends_on:
      broker:
        condition: service_healthy

  consumer-1:
    build: ./consumer
    environment:
      CONSUMER_NAME: consumer-1
      BOOBLIK_HOST: broker
      BOOBLIK_TOPIC: events
      BOOBLIK_PARTITION: 1
    volumes:
      - consumer-1-state:/var/lib/consumer
    ports:
      - "8082:8080"
    depends_on:
      broker:
        condition: service_healthy

  consumer-2:
    build: ./consumer
    environment:
      CONSUMER_NAME: consumer-2
      BOOBLIK_HOST: broker
      BOOBLIK_TOPIC: events
      BOOBLIK_PARTITION: 2
    volumes:
      - consumer-2-state:/var/lib/consumer
    ports:
      - "8083:8080"
    depends_on:
      broker:
        condition: service_healthy

  worker-0:
    build: ./queue-worker
    profiles: [queue]
    environment:
      WORKER_NAME: worker-0
      BOOBLIK_HOST: broker
      # Short lease and long work only matter to check-redistribution.sh, which needs a worker to
      # be visibly holding a task when it is killed, and the task to come free soon enough to watch.
      WORKER_LEASE_MILLIS: ${WORKER_LEASE_MILLIS:-30000}
      WORKER_WORK_MILLIS: ${WORKER_WORK_MILLIS:-400}
      WORKER_PICK: ${WORKER_PICK:-random}
    ports:
      - "8091:8080"
    depends_on:
      broker:
        condition: service_healthy

  worker-1:
    build: ./queue-worker
    profiles: [queue]
    environment:
      WORKER_NAME: worker-1
      BOOBLIK_HOST: broker
      # Short lease and long work only matter to check-redistribution.sh, which needs a worker to
      # be visibly holding a task when it is killed, and the task to come free soon enough to watch.
      WORKER_LEASE_MILLIS: ${WORKER_LEASE_MILLIS:-30000}
      WORKER_WORK_MILLIS: ${WORKER_WORK_MILLIS:-400}
      WORKER_PICK: ${WORKER_PICK:-random}
    ports:
      - "8092:8080"
    depends_on:
      broker:
        condition: service_healthy

  worker-2:
    build: ./queue-worker
    profiles: [queue]
    environment:
      WORKER_NAME: worker-2
      BOOBLIK_HOST: broker
      # Short lease and long work only matter to check-redistribution.sh, which needs a worker to
      # be visibly holding a task when it is killed, and the task to come free soon enough to watch.
      WORKER_LEASE_MILLIS: ${WORKER_LEASE_MILLIS:-30000}
      WORKER_WORK_MILLIS: ${WORKER_WORK_MILLIS:-400}
      WORKER_PICK: ${WORKER_PICK:-random}
    ports:
      - "8093:8080"
    depends_on:
      broker:
        condition: service_healthy

  # The same worker with no published port, so `--scale` can raise a crowd of them. Thirty services
  # cannot each own a host port, and for the measurement nobody asks them anything anyway: the
  # numbers are read out of the claims log by `queue-report`.
  worker:
    build: ./queue-worker
    profiles: [swarm]
    environment:
      BOOBLIK_HOST: broker
      # `first` or `random` — which claimable task a worker goes for. The measurement in M-103 is
      # about the difference, so it has to be settable from outside the file.
      WORKER_PICK: ${WORKER_PICK:-first}
    depends_on:
      broker:
        condition: service_healthy

  # Kafka, as itself, so the relay is checked against the real protocol rather than a stand-in.
  # The official image needs no configuration at all in KRaft mode.
  kafka:
    image: apache/kafka:4.1.1
    profiles: [relay]
    ports:
      - "19092:9092"

  # Kafka -> booblik. The position lives in Kafka, named by a consumer group.
  relay-in:
    build: ./relay
    profiles: [relay]
    environment:
      RELAY_NAME: relay-in
      RELAY_DIRECTION: KAFKA_TO_BOOBLIK
      BOOBLIK_HOST: broker
      BOOBLIK_TOPIC: mirrored
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: orders
    ports:
      - "8094:8080"
    depends_on:
      broker:
        condition: service_healthy

  # booblik -> Kafka. Nothing on the broker remembers a reader, so this one keeps a file on a
  # volume — the same FileOffsetStore the consumer uses.
  relay-out:
    build: ./relay
    profiles: [relay]
    environment:
      RELAY_NAME: relay-out
      RELAY_DIRECTION: BOOBLIK_TO_KAFKA
      BOOBLIK_HOST: broker
      BOOBLIK_TOPIC: mirrored
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: mirrored-back
    volumes:
      - relay-out-state:/var/lib/relay
    ports:
      - "8095:8080"
    depends_on:
      broker:
        condition: service_healthy

volumes:
  broker-data:
  consumer-0-state:
  consumer-1-state:
  consumer-2-state:
  relay-out-state:
