name: publish-central

# Publishing the four JVM/Native modules to Maven Central, through the Portal API.
#
# **By dispatch, not by tag.** A release on Central can never be deleted — only superseded by a
# higher version — so the decision to publish one is a decision somebody makes, not a consequence of
# pushing a tag. `publish.yml` (reposilite) stays as it is: that repository is where a version is
# tried, and this is where it becomes permanent.
#
# The default `publishingType` is `USER_MANAGED`: the bundle is validated and then **waits** in the
# Portal for a human to release it. `AUTOMATIC` skips that pause, and the only good reason to pick
# it is having already done this by hand once.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 0.3.2'
        required: true
        type: string
      publishingType:
        description: 'USER_MANAGED waits for a click in the Portal; AUTOMATIC does not'
        required: true
        default: 'USER_MANAGED'
        type: choice
        options: ['USER_MANAGED', 'AUTOMATIC']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: central

    steps:
      - uses: actions/checkout@v7

      - uses: youndie/sborka/.github/actions/setup-kotlin@main

      # Before anything is uploaded, and not out of ceremony: a dispatch can name any ref, including
      # one nothing has ever checked, and Central has no delete.
      - name: Check
        run: ./gradlew check --stacktrace

      - name: Bundle
        env:
          ORG_GRADLE_PROJECT_SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./ci/central-bundle.sh "${{ inputs.version }}"

      - name: Upload to the Portal
        id: upload
        env:
          CENTRAL_USER: ${{ secrets.CENTRAL_USER }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
        run: |
          if [ -z "$CENTRAL_USER" ] || [ -z "$CENTRAL_TOKEN" ]; then
            echo "::error::CENTRAL_USER/CENTRAL_TOKEN are not set — generate a user token in the Portal"
            exit 1
          fi
          AUTH=$(printf '%s:%s' "$CENTRAL_USER" "$CENTRAL_TOKEN" | base64 | tr -d '\n')
          BUNDLE="build/central-bundle-${{ inputs.version }}.zip"

          # `--fail-with-body`, so a rejection prints what the Portal said instead of an exit code.
          DEPLOYMENT=$(curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Authorization: Bearer $AUTH" \
            --form "bundle=@$BUNDLE" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=booblik-${{ inputs.version }}&publishingType=${{ inputs.publishingType }}")
          echo "deployment: $DEPLOYMENT"
          echo "id=$DEPLOYMENT" >> "$GITHUB_OUTPUT"

      # A green upload means the bundle was accepted for validation, which is not the same as valid.
      # This is the step that tells the two apart, and it is the reason this workflow does not end at
      # the POST.
      - name: Wait for validation
        env:
          CENTRAL_USER: ${{ secrets.CENTRAL_USER }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
        run: |
          AUTH=$(printf '%s:%s' "$CENTRAL_USER" "$CENTRAL_TOKEN" | base64 | tr -d '\n')
          ID="${{ steps.upload.outputs.id }}"
          for attempt in $(seq 1 40); do
            BODY=$(curl --silent --show-error --fail-with-body \
              --request POST \
              --header "Authorization: Bearer $AUTH" \
              "https://central.sonatype.com/api/v1/publisher/status?id=$ID")
            STATE=$(printf '%s' "$BODY" | grep -o '"deploymentState"[[:space:]]*:[[:space:]]*"[A-Z_]*"' | head -1 | sed 's/.*"\([A-Z_]*\)"$/\1/')
            echo "attempt $attempt: ${STATE:-unknown}"
            case "$STATE" in
              VALIDATED)
                echo "::notice::validated and waiting for release in the Portal (publishingType USER_MANAGED)"
                exit 0
                ;;
              PUBLISHED)
                echo "::notice::published"
                exit 0
                ;;
              FAILED)
                echo "::error::the Portal rejected the bundle"
                printf '%s\n' "$BODY"
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "::error::still not validated after ten minutes; the deployment is $ID in the Portal"
          exit 1
