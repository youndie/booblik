name: release

# Publishing the image to GHCR (M-92). By tag, because publishing is a decision rather than a
# consequence of pushing: `v0.1.0` produces `:0.1.0` and `:latest`.
#
# amd64 only. That is what a broker runs on and what every number in docs/benchmarking.md was
# measured on; arm64 gets added when somebody needs it, on a native runner rather than through
# QEMU — the image has a `RUN` in it, and emulating that buys a slow build for nobody.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (empty — the git tag without the leading v)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: version
        run: |
          VERSION="${{ inputs.tag }}"
          if [ -z "$VERSION" ]; then
            # Only a tag ref may name a version by itself. Dispatched from a branch this would
            # otherwise publish `:main` and, worse, move `:latest` onto it.
            if [ "$GITHUB_REF_TYPE" != "tag" ]; then
              echo "::error::run from a tag, or pass the tag input — a branch does not name a version"
              exit 1
            fi
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          # Lowercase: a registry rejects an image reference with capitals in it, and the owner of
          # a repository is free to have them.
          IMAGE="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Publishing $IMAGE:$VERSION"

      # The gate runs before anything is pushed. A tag can be put on any commit, including one
      # nothing has ever checked, and an image in a registry outlives a red build.
      - name: Gate
        run: ./gradlew check --stacktrace

      - name: Build the image
        env:
          BOOBLIK_SKIP_GATE: '1'
        run: ./ci/docker-build.sh "${{ steps.version.outputs.image }}:${{ steps.version.outputs.value }}"

      # Checked before it is pushed, not after. A registry has no undo that anybody's `docker pull`
      # would respect.
      - name: Check the image
        env:
          BOOBLIK_IMAGE: ${{ steps.version.outputs.image }}:${{ steps.version.outputs.value }}
        run: ./ci/docker-smoke.sh

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        run: |
          IMAGE="${{ steps.version.outputs.image }}"
          VERSION="${{ steps.version.outputs.value }}"
          docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull $IMAGE:$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
