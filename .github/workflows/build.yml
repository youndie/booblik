name: build

# `check` is the whole gate: tests and ktlint, in every module. ktlint has no step of its own
# because the plugin hangs `ktlintCheck` on `check` — a separate CI line would only be able to
# drift out of sync with what a developer runs locally.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      # 25 is the toolchain the project asks for. Gradle would provision it itself through the
      # foojay resolver in settings.gradle.kts, but doing it here means one download the runner
      # cache can keep rather than one it fetches every time.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Check
        run: ./gradlew check --stacktrace

      # Benchmarks are compiled, never run here. Compiling them is the point: a benchmark that no
      # ordinary build touches rots silently and is discovered the day its number is needed.
      # Running them on a shared CI runner would produce numbers nobody may compare to anything —
      # see the host rule in docs/benchmarking.md.
      - name: Compile benchmarks
        run: ./gradlew :booblik-benchmark:assembleBenchmarks --stacktrace

      # The broker has to actually start. A distribution that builds and then dies on its own
      # config file is a thing `check` cannot see, and it is exactly what shipping means here.
      - name: Smoke-test the packaged broker
        run: ./ci/smoke.sh

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: warn

  # The image, checked on every push rather than when somebody remembers (M-91). This is the only
  # place the six profile flags are verified **in a live process**: they are baked into the start
  # script, and one JAVA_OPTS line in a Dockerfile replaces them silently — after which what ships
  # is a process nobody measured (risk 7).
  #
  # A job of its own, not a step in `check`: it needs a Docker daemon, and it must not be able to
  # make the gate look red for a reason that has nothing to do with the code.
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      # The gate is skipped here on purpose and the script says so out loud. The `check` job above
      # is running the same commit; paying for it twice would buy nothing but minutes.
      - name: Build the image
        env:
          BOOBLIK_SKIP_GATE: '1'
        run: ./ci/docker-build.sh booblik:ci

      - name: Check the image
        env:
          BOOBLIK_IMAGE: booblik:ci
        run: ./ci/docker-smoke.sh

  # The sample, built against the **published** client rather than against this checkout.
  #
  # That is the point of the job. Everything else here compiles the modules together, where a
  # packaging mistake is invisible: 0.1.1 went out with coroutines at runtime scope, so it resolved
  # and then would not compile, and nothing in this file could have noticed. This job is that
  # discovery made permanent — it fails the same way a stranger's build would.
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      # `build` includes the sample's own gate now: ktlint, and the unit tests of the queue's
      # arbiter. The arbiter is pure logic whose correctness argument was previously made only by
      # an end-to-end run that needs Docker, a broker and three workers.
      - name: Build the sample
        working-directory: dev
        run: ./gradlew build --stacktrace

      # And then it is actually run. Six scripts in dev/ assert real behaviour — the partition
      # split, a position that outlives its process, a task won by exactly one worker, a view
      # rebuilt by replaying — and until now they ran when somebody remembered. That is the same
      # gap the image job was created to close, one level up.
      #
      # This is also the only job that exercises the **published** client against the **published**
      # image, which is the combination a stranger gets.
      - name: Run the sample and check what it claims
        working-directory: dev
        run: ./run.sh

      - name: Layer 1 — partitions and positions
        working-directory: dev
        run: ./check.sh

      - name: Layer 2 — the task queue
        working-directory: dev
        run: |
          docker compose --profile queue up -d --build
          # The queue needs tasks to have gone round before anything can be asserted about them.
          sleep 45
          ./check-queue.sh

      - name: Layer 3 — the read model
        working-directory: dev
        run: |
          docker compose --profile projection up -d --build
          ./check-projection.sh

      - name: What the services were saying
        if: failure()
        working-directory: dev
        run: docker compose --profile queue --profile projection logs --tail 40

      - name: Down
        if: always()
        working-directory: dev
        run: docker compose --profile queue --profile projection down -v
