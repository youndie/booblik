name: publish

# Publishing the JVM and Kotlin/Native client libraries to a Maven repository (M-93, M-150, M-151).
# Manual only: a library goes out by decision, not on every push.
#
# The address and the credentials live in repository secrets (BOOBLIK_REPO_URL / _USER / _SECRET),
# never in files: whoever builds booblik publishes to their own repository.
#
# **Four modules go out, and none of them is there for symmetry.** The dependencies are `api`, so
# every one of them is on a consumer's compile classpath:
#
#     booblik-client → booblik-core → booblik-protocol (as booblik-protocol-jvm)
#     booblik-native → booblik-protocol
#
# `booblik-protocol` was added in M-150 after being missing since M-134 — the module was extracted,
# `booblik-core` started depending on it through `api`, and this workflow went on publishing the two
# it always had. A publish would have produced exactly the failure the M9 lesson is about: green
# upload, unresolvable dependency at the consumer. The `Verify` step below now walks the whole chain
# rather than one link of it.
#
# **On macOS, and that is a requirement rather than a preference.** `booblik-protocol` and
# `booblik-native` carry a `macosArm64` target whose klib only builds on macOS, while `linuxX64`
# builds there too (the ABI dump taken on a mac in M-138 carries both targets). A multiplatform
# module has to publish its root module and every target in **one run from one host**, or the root
# points at variants that do not exist.
#
# The server is not published at all — see docs/services/booblik-client.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (empty — 0.1.<run number>)'
        required: false
        type: string

jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      # Java and Gradle in one step and at one version for the portfolio: the action installs 21 and
      # 25 and leaves 25 as the default, which is what this build asks for.
      - uses: youndie/sborka/.github/actions/setup-kotlin@main

      - name: Version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="0.1.${{ github.run_number }}"; fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION"

      # The gate runs here too, and not out of caution: `publish` can be dispatched from any ref,
      # including one nothing has ever checked. An artefact is forever in a way a red build is not.
      - name: Check
        run: ./gradlew check --stacktrace

      - name: Publish
        # The ORG_GRADLE_PROJECT_ prefix turns an environment variable into a Gradle **project
        # property**, which is what `providers.gradleProperty(…)` reads. The names are
        # `ru.workinprogress.sborka.publish`'s rather than this repository's since the migration, and
        # the repository is called `wip` — this repository's secrets are simply handed to them.
        #
        # The destination is passed explicitly rather than left to the convention's default, which is
        # the shared snapshot repository. It is the same address today; a publish that silently went
        # somewhere else because a secret was empty is the failure worth refusing, and sborka refuses
        # a value that is not an absolute http(s) URL.
        env:
          ORG_GRADLE_PROJECT_REPOSILITE_USER: ${{ secrets.BOOBLIK_REPO_USER }}
          ORG_GRADLE_PROJECT_REPOSILITE_SECRET: ${{ secrets.BOOBLIK_REPO_SECRET }}
          BOOBLIK_REPO_URL: ${{ secrets.BOOBLIK_REPO_URL }}
        run: |
          ./gradlew \
            :booblik-protocol:publishAllPublicationsToWipRepository \
            :booblik-core:publishAllPublicationsToWipRepository \
            :booblik-client:publishAllPublicationsToWipRepository \
            :booblik-native:publishAllPublicationsToWipRepository \
            -Psborka.snapshotRepository="$BOOBLIK_REPO_URL" \
            -PVERSION=${{ steps.version.outputs.value }} --stacktrace

      # A successful upload only says the upload did not fail. What a consumer actually gets is in
      # the POM, and the thing that would break them is not visible in a green run: a client whose
      # POM points at a core that was not published, or at a different version of it.
      - name: Verify what was published
        env:
          BOOBLIK_REPO_URL: ${{ secrets.BOOBLIK_REPO_URL }}
          BOOBLIK_REPO_USER: ${{ secrets.BOOBLIK_REPO_USER }}
          BOOBLIK_REPO_SECRET: ${{ secrets.BOOBLIK_REPO_SECRET }}
        run: |
          VERSION=${{ steps.version.outputs.value }}
          # The same default as the publish convention's: the URL secret is optional, and without
          # this the step would die on a malformed URL while the publish itself had succeeded.
          ROOT="${BOOBLIK_REPO_URL:-https://reposilite.kotlin.website/snapshots}/io/github/youndie/booblik"

          for MODULE_NAME in booblik-core booblik-client booblik-protocol-jvm; do
            BASE="$ROOT/$MODULE_NAME/$VERSION"
            curl -fsSL -u "$BOOBLIK_REPO_USER:$BOOBLIK_REPO_SECRET" -o /dev/null "$BASE/$MODULE_NAME-$VERSION.jar"
            echo "Published: io.github.youndie.booblik:$MODULE_NAME:$VERSION"
          done

          # The native targets, whose artefact is a klib rather than a jar. Checked by name because
          # a multiplatform module that published its root and lost a target leaves a consumer with
          # a resolvable module and no code for their platform.
          for MODULE_NAME in booblik-protocol booblik-native; do
            for TARGET in linuxx64 macosarm64; do
              BASE="$ROOT/$MODULE_NAME-$TARGET/$VERSION"
              curl -fsSL -u "$BOOBLIK_REPO_USER:$BOOBLIK_REPO_SECRET" -o /dev/null \
                "$BASE/$MODULE_NAME-$TARGET-$VERSION.klib"
              echo "Published: io.github.youndie.booblik:$MODULE_NAME-$TARGET:$VERSION"
            done
          done

          POM=$(curl -fsSL -u "$BOOBLIK_REPO_USER:$BOOBLIK_REPO_SECRET" \
            "$ROOT/booblik-client/$VERSION/booblik-client-$VERSION.pom")
          FLAT=$(echo "$POM" | tr -d '[:space:]')

          if ! echo "$FLAT" | grep -q "<artifactId>booblik-core</artifactId><version>$VERSION</version>"; then
            echo "::error::the client POM does not depend on booblik-core $VERSION — the consumer gets an unresolvable dependency"
            echo "$POM"
            exit 1
          fi

          # One link further down, which is the link that was missing. `booblik-core` gained an
          # `api` dependency on the protocol module in M-134 and nothing here noticed until M-150.
          CORE_POM=$(curl -fsSL -u "$BOOBLIK_REPO_USER:$BOOBLIK_REPO_SECRET" \
            "$ROOT/booblik-core/$VERSION/booblik-core-$VERSION.pom")
          if ! echo "$CORE_POM" | tr -d '[:space:]' | \
            grep -q "<artifactId>booblik-protocol-jvm</artifactId><version>$VERSION</version>"; then
            echo "::error::the core POM does not depend on booblik-protocol-jvm $VERSION"
            echo "$CORE_POM"
            exit 1
          fi

          # Everything the public API mentions has to be at compile scope, and coroutines are the
          # case that got out: `follow()` returns a `Flow` and the constructors take a
          # `CoroutineScope`, but the dependency was declared `implementation`, so 0.1.1 published a
          # library nobody could compile against. Found by building a consumer, not by reading.
          if ! echo "$FLAT" | grep -q "<artifactId>kotlinx-coroutines-core-jvm</artifactId><version>[^<]*</version><scope>compile</scope>"; then
            echo "::error::coroutines are not at compile scope in the client POM — the API mentions Flow and CoroutineScope, so a consumer cannot compile"
            echo "$POM"
            exit 1
          fi
          echo "The client POM points at booblik-core $VERSION and exposes coroutines at compile scope"
