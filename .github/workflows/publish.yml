name: publish

# Publishing the client library to a Maven repository (M-93). Manual only: a library goes out by
# decision, not on every push.
#
# The address and the credentials live in repository secrets (BOOBLIK_REPO_URL / _USER / _SECRET),
# never in files: whoever builds booblik publishes to their own repository.
#
# Two modules go out, and the second is not there for symmetry. `booblik-client` depends on
# `booblik-core` through `api`, so a client published on its own is a POM pointing at an artefact
# that is not in the repository. The server is not published at all — see docs/services/booblik-client.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (empty — 0.1.<run number>)'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="0.1.${{ github.run_number }}"; fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION"

      # The gate runs here too, and not out of caution: `publish` can be dispatched from any ref,
      # including one nothing has ever checked. An artefact is forever in a way a red build is not.
      - name: Check
        run: ./gradlew check --stacktrace

      - name: Publish
        # The ORG_GRADLE_PROJECT_ prefix turns an environment variable into a Gradle **project
        # property**, which is what `providers.gradleProperty(…)` reads. Plain environment variables
        # work too through the fallback in publishing.gradle.kts, but properties are the mechanism
        # Gradle documents.
        env:
          ORG_GRADLE_PROJECT_BOOBLIK_REPO_URL: ${{ secrets.BOOBLIK_REPO_URL }}
          ORG_GRADLE_PROJECT_BOOBLIK_REPO_USER: ${{ secrets.BOOBLIK_REPO_USER }}
          ORG_GRADLE_PROJECT_BOOBLIK_REPO_SECRET: ${{ secrets.BOOBLIK_REPO_SECRET }}
        run: |
          ./gradlew \
            :booblik-core:publishAllPublicationsToBooblikRepoRepository \
            :booblik-client:publishAllPublicationsToBooblikRepoRepository \
            -PVERSION=${{ steps.version.outputs.value }} --stacktrace

      # A successful upload only says the upload did not fail. What a consumer actually gets is in
      # the POM, and the thing that would break them is not visible in a green run: a client whose
      # POM points at a core that was not published, or at a different version of it.
      - name: Verify what was published
        env:
          BOOBLIK_REPO_URL: ${{ secrets.BOOBLIK_REPO_URL }}
          BOOBLIK_REPO_USER: ${{ secrets.BOOBLIK_REPO_USER }}
          BOOBLIK_REPO_SECRET: ${{ secrets.BOOBLIK_REPO_SECRET }}
        run: |
          VERSION=${{ steps.version.outputs.value }}
          # The same default as in publishing.gradle.kts: the URL secret is optional, and without
          # this the step would die on a malformed URL while the publish itself had succeeded.
          ROOT="${BOOBLIK_REPO_URL:-https://reposilite.kotlin.website/snapshots}/io/github/youndie/booblik"

          for MODULE_NAME in booblik-core booblik-client; do
            BASE="$ROOT/$MODULE_NAME/$VERSION"
            curl -fsSL -u "$BOOBLIK_REPO_USER:$BOOBLIK_REPO_SECRET" -o /dev/null "$BASE/$MODULE_NAME-$VERSION.jar"
            echo "Published: io.github.youndie.booblik:$MODULE_NAME:$VERSION"
          done

          POM=$(curl -fsSL -u "$BOOBLIK_REPO_USER:$BOOBLIK_REPO_SECRET" \
            "$ROOT/booblik-client/$VERSION/booblik-client-$VERSION.pom")
          FLAT=$(echo "$POM" | tr -d '[:space:]')

          if ! echo "$FLAT" | grep -q "<artifactId>booblik-core</artifactId><version>$VERSION</version>"; then
            echo "::error::the client POM does not depend on booblik-core $VERSION — the consumer gets an unresolvable dependency"
            echo "$POM"
            exit 1
          fi

          # Everything the public API mentions has to be at compile scope, and coroutines are the
          # case that got out: `follow()` returns a `Flow` and the constructors take a
          # `CoroutineScope`, but the dependency was declared `implementation`, so 0.1.1 published a
          # library nobody could compile against. Found by building a consumer, not by reading.
          if ! echo "$FLAT" | grep -q "<artifactId>kotlinx-coroutines-core-jvm</artifactId><version>[^<]*</version><scope>compile</scope>"; then
            echo "::error::coroutines are not at compile scope in the client POM — the API mentions Flow and CoroutineScope, so a consumer cannot compile"
            echo "$POM"
            exit 1
          fi
          echo "The client POM points at booblik-core $VERSION and exposes coroutines at compile scope"
