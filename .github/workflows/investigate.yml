name: investigate

# A one-off: why does the ranking of the two write paths under durability flip on this runner?
#
# The scheduled benchmark measured, within one run, that FILE_CHANNEL beats MAPPED by 1.5x when
# every append is flushed — the opposite of what M-46 measured on a rented machine. Two mechanisms
# would explain it and they have different consequences:
#
#   * the barrier here is cheap (~0.2 ms against 11.36 ms), so MAPPED's **second** barrier —
#     force() calls msync and then fsync — stops being lost in the noise. A property of the host.
#   * msync walks the whole mapping, and the benchmark maps 1 GiB per segment, so the cost is paid
#     per append no matter how few bytes are dirty. A defect in our code, fixable by syncing only
#     the range that was written.
#
# probeDurability decomposes the barrier; the inline probe compares force() over the whole mapping
# against force() over the written page. Delete this workflow once the answer is recorded.

on:
  workflow_dispatch:

jobs:
  investigate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Record the host
        run: |
          {
            echo "runner: ${{ runner.name }} / ${{ runner.arch }}"
            echo "cpu: $(nproc) x $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs)"
            echo "filesystem: $(findmnt -no FSTYPE -T .) on $(findmnt -no SOURCE -T .)"
            echo "page size: $(getconf PAGE_SIZE)"
            echo "rotational: $(cat /sys/block/$(lsblk -no PKNAME "$(findmnt -no SOURCE -T .)" | head -1)/queue/rotational 2>/dev/null || echo '?')"
          } | tee host.txt

      # Decomposes the barrier: msync alone, fsync alone, and both on the same file — which is what
      # MappedSegmentWriter.force() actually does.
      - name: Durability probe
        run: ./gradlew :booblik-benchmark:probeDurability --console=plain | tee durability.txt

      - name: Reproduce both write paths side by side
        run: |
          cat > Paths.java <<'JAVA'
          import java.lang.foreign.Arena;
          import java.lang.foreign.MemorySegment;
          import java.lang.foreign.ValueLayout;
          import java.nio.ByteBuffer;
          import java.nio.channels.FileChannel;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.nio.file.StandardOpenOption;
          import java.util.Arrays;

          /**
           * The two append paths of booblik, in miniature, in one process on one host.
           *
           * Each variant writes `record` bytes at the next offset and makes them durable, exactly as
           * SegmentAppendBenchmark does with flushEveryAppend. The variants differ only in how, so
           * whatever separates them here is what separates them there.
           *
           *   mapped      MemorySegment.copy, then force() over the whole mapping, then fdatasync
           *   mapped-nom  the same without the msync — isolates what the msync costs
           *   channel     gathering write(), then fdatasync
           *   channel-nof write() without any barrier — the floor of the syscall itself
           */
          public final class Paths {
              public static void main(String[] args) throws Exception {
                  long capacity = Long.parseLong(args[0]);
                  int iterations = Integer.parseInt(args[1]);
                  int record = Integer.parseInt(args[2]);
                  System.out.printf("capacity %.0f MiB, %d iterations, record %d B%n",
                      capacity / 1024.0 / 1024, iterations, record);

                  for (String mode : new String[] {"mapped", "channel", "mapped-nom", "channel-nof",
                                                   "mapped", "channel"}) {
                      System.out.printf("  %-12s %s%n", mode, run(mode, capacity, iterations, record));
                  }
              }

              private static String run(String mode, long capacity, int iterations, int record)
                      throws Exception {
                  Path file = Files.createTempFile(Path.of("."), "paths", ".log");
                  try (FileChannel channel = FileChannel.open(file, StandardOpenOption.READ,
                                                              StandardOpenOption.WRITE);
                       Arena arena = Arena.ofShared()) {
                      channel.write(ByteBuffer.allocate(1), capacity - 1);
                      boolean mapped = mode.startsWith("mapped");
                      MemorySegment segment = mapped
                          ? channel.map(FileChannel.MapMode.READ_WRITE, 0, capacity, arena)
                          : null;
                      MemorySegment source = mapped ? MemorySegment.ofArray(new byte[record]) : null;
                      ByteBuffer buffer = mapped ? null : ByteBuffer.allocateDirect(record);

                      long[] samples = new long[iterations];
                      long position = 0;
                      for (int i = 0; i < iterations; i++) {
                          long start = System.nanoTime();
                          if (mapped) {
                              MemorySegment.copy(source, 0, segment, position, record);
                              segment.set(ValueLayout.JAVA_INT_UNALIGNED, position, record);
                              if (!mode.endsWith("-nom")) segment.force();
                              channel.force(false);
                          } else {
                              buffer.clear();
                              channel.write(buffer, position);
                              if (!mode.endsWith("-nof")) channel.force(false);
                          }
                          samples[i] = System.nanoTime() - start;
                          position += record;
                      }
                      Arrays.sort(samples);
                      return String.format("median %8.3f ms   p90 %8.3f ms   min %8.3f ms",
                          samples[iterations / 2] / 1e6,
                          samples[(int) (iterations * 0.9)] / 1e6, samples[0] / 1e6);
                  } finally {
                      Files.deleteIfExists(file);
                  }
              }
          }
          JAVA
          # 1 GiB and 64 B are what SegmentAppendBenchmark uses.
          java Paths.java 1073741824 400 64 | tee paths.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: investigation
          path: |
            host.txt
            durability.txt
            paths.txt
