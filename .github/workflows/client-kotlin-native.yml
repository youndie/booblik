name: client-kotlin-native

# One workflow per client, because GitHub applies `paths:` to a whole workflow rather than to a job.
#
# This one watches the Gradle modules rather than a directory under `clients/`, because the sources
# are there: Kotlin/Native is a **target** of the shared protocol, not a reimplementation of it.
# `conformance/**` is in the list for the same reason as everywhere else — the kit and the vectors
# are shared, so a change to either has to re-run every client.

on:
  push:
    branches: [main]
    paths:
      - 'booblik-native/**'
      - 'booblik-native-conformance/**'
      - 'booblik-protocol/**'
      - 'clients/kotlin-native/**'
      - 'conformance/**'
      - '.github/workflows/client-kotlin-native.yml'
  pull_request:
    paths:
      - 'booblik-native/**'
      - 'booblik-native-conformance/**'
      - 'booblik-protocol/**'
      - 'clients/kotlin-native/**'
      - 'conformance/**'
      - '.github/workflows/client-kotlin-native.yml'
  workflow_dispatch:

jobs:
  # Both targets, because a test binary runs only on its own host: linuxX64 does not execute on
  # macOS and macosArm64 does not execute on Linux. One runner would leave half the native code
  # compiled and never run, which is the state this milestone existed to get out of.
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Gate
        run: ./clients/kotlin-native/gate.sh

  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      # Ubuntu only, and not because linuxX64 is the interesting target: GitHub's macOS runners have
      # no Docker daemon, so there is nowhere to start a broker. The macosArm64 binary is compiled
      # and unit-tested in the job above; what the kit adds is a live broker, and that is a Linux
      # thing here.
      - name: Build the image
        env:
          BOOBLIK_SKIP_GATE: '1'
        run: ./ci/docker-build.sh booblik:ci

      # The only check that can catch a client which is wrong self-consistently — most of all a
      # partitioner that disagrees with the specification.
      - name: Conformance
        env:
          BOOBLIK_IMAGE: booblik:ci
        run: ./conformance/run.sh clients/kotlin-native/conformance-client.sh
